[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "autoharness"
version = "1.5.0"
description = "Globally-installed agent harness framework that generates AI coding assistant primitives into any target workspace"
readme = "README.md"
license = "MIT"
requires-python = ">=3.10"
dependencies = [
    "jsonschema>=4.23.0",
    "PyYAML>=6.0.2",
]
authors = [{ name = "softwaresalt" }]
keywords = ["ai", "agent", "harness", "copilot", "coding-assistant"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Topic :: Software Development :: Quality Assurance",
]

[project.scripts]
autoharness = "autoharness.cli:main"

[project.urls]
Repository = "https://github.com/softwaresalt/autoharness"

[tool.hatch.build.targets.wheel]
packages = ["src/autoharness"]
# Pin core-metadata-version to 2.4: hatchling 1.32.0 defaults to 2.5 (PEP 794,
# ratified September 2025), but the pinned pypa/gh-action-pypi-publish action
# used by release.yml bundles twine < 7.0.0 (packaging < 26.0), which does not
# yet recognize Metadata-Version 2.5 and raises
# "InvalidDistribution: Invalid distribution metadata: '2.5' is not a valid
# metadata version". 2.4 is fully supported by every current PyPI toolchain.
core-metadata-version = "2.4"

[tool.hatch.build.targets.sdist]
core-metadata-version = "2.4"

[tool.hatch.build.targets.wheel.force-include]
"templates" = "src/autoharness/data/templates"
"schemas" = "src/autoharness/data/schemas"
".github/agents" = "src/autoharness/data/.github/agents"
".github/skills" = "src/autoharness/data/.github/skills"
".github/instructions" = "src/autoharness/data/.github/instructions"
".github/prompts" = "src/autoharness/data/.github/prompts"
".github/copilot-instructions.md" = "src/autoharness/data/.github/copilot-instructions.md"
".github/copilot-review-instructions.md" = "src/autoharness/data/.github/copilot-review-instructions.md"
"docs" = "src/autoharness/data/docs"
"AGENTS.md" = "src/autoharness/data/AGENTS.md"

[tool.pytest.ini_options]
pythonpath = ["src"]
