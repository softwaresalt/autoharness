name: CI

# autoharness dogfood instance of the unified CI + local-gating primitive
# (templates/ci/ci.yml.tmpl). Four jobs:
#   1. changes         — always-runs, fail-closed detection of code vs docs/backlog.
#   2. test            — the expensive gate: runs the unittest suite. Runs
#                         whenever `changes` reports code == 'true'; skipped only
#                         for docs/backlog-only PRs (path impact is the sole
#                         condition).
#   3. topology-check  — always-running pipeline-topology CI backstop (Gate C,
#                         109.014-T / P-001 / P-016), required-vs-advisory via the
#                         `PIPELINE_TOPOLOGY_GATE_REQUIRED` repository variable.
#                         See docs/pipeline-topology-gate.md and
#                         docs/pipeline-topology-gate-ci-rollout.md.
#   4. ci-gate         — always-runs aggregation gate (check name `ci gate`). It
#                         runs no build; it simply summarizes the needed jobs,
#                         failing only when a needed job failed or was cancelled
#                         and treating a skipped test job as OK.
#
# Regular PR/push CI is Linux-only. Cross-OS (macOS/Windows) verification and
# publishing live in release.yml (tag-triggered) — this workflow does NOT
# duplicate release.yml. autoharness has no ruff/pyright/pytest configured; the
# only real gates are the stdlib unittest suite (here) and markdownlint (the
# pre-commit/pre-push hooks). No lint/format/typecheck steps are invented.
on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Lightweight always-running gate. predicate-quantifier 'every' makes the '!'
  # negations exclude docs/backlog/harness state per file; any code/config/
  # unknown-type change fails CLOSED into the test gate below.
  changes:
    name: detect code changes
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
    outputs:
      code: ${{ steps.filter.outputs.code }}
    steps:
      - name: Checkout
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          persist-credentials: false
      - name: Detect code changes
        id: filter
        uses: dorny/paths-filter@d1c1ffe0248fe513906c8e24db8ea791d46f8590 # v3.0.3
        with:
          predicate-quantifier: 'every'
          # Fail-closed denylist under predicate-quantifier 'every': a changed
          # file counts as code unless it lives in a positively-identified
          # docs/state directory. Markdown is executable product in this repo
          # (agent/skill/instruction files under .github/), so it is NOT excluded
          # by extension — only these specific directories are.
          filters: |
            code:
              - '**'
              - '!docs/**'
              - '!.backlogit/**'
              - '!.autoharness/**'

  # Expensive gate: the stdlib unittest suite. Runs only when the fail-closed
  # `changes` job detected a code/config change. Execution is gated SOLELY on the
  # path result, so a code change can never bypass the tests via a `docs:`/`chore:`
  # PR title; docs/backlog-only PRs skip because `changes` reports code == 'false'.
  test:
    name: test
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          persist-credentials: false
      - name: Set up Python 3.12
        uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405 # v6.2.0
        with:
          python-version: '3.12'
      - name: Install runtime dependencies
        run: python -m pip install --upgrade pip jsonschema PyYAML
      # Pinned, checksum-verified backlogit binary so
      # tests/test_spike_template_docline_frontmatter.py's real-linter
      # acceptance tests (128.002-T) are not silently skipped in CI --
      # flagged by Copilot review on PR #354: without this, the PR's core
      # external-contract claim (generated artifacts pass
      # `backlogit docs lint`) was protected only by structural assertions
      # that duplicate the expected shape, so a future docline-contract
      # drift in backlogit would not be caught here.
      - name: Install backlogit (pinned v1.9.0, checksum-verified)
        run: |
          set -euo pipefail
          curl -fsSL -o backlogit-linux-amd64 https://github.com/softwaresalt/backlogit/releases/download/v1.9.0/backlogit-linux-amd64
          echo "5bf29fdacb6a927d2cb2d255eceb979078e09ae1adcafba93433b22049ce87de  backlogit-linux-amd64" | sha256sum -c -
          chmod +x backlogit-linux-amd64
          mkdir -p "$RUNNER_TEMP/bin"
          mv backlogit-linux-amd64 "$RUNNER_TEMP/bin/backlogit"
          echo "$RUNNER_TEMP/bin" >> "$GITHUB_PATH"
      - name: Run unittest suite
        run: PYTHONPATH=src python -m unittest discover -s tests

  # Pipeline-topology CI backstop (Gate C, 109.014-T): the server-side,
  # NON-BYPASSABLE re-validation of the P-001 (at-most-one-active-shipment) /
  # P-016 (single implementation worktree/branch) invariants. Local hooks
  # (pre-commit-pipeline-topology.*, pre-push-quality-gates.*) are always
  # skippable via `git ... --no-verify`, and Git has no pre-worktree-add hook
  # at all -- CI is the authoritative backstop once a checkout syncs.
  #
  # Always runs -- unlike `test`, this job is NOT gated on the `changes`
  # path-filter output: the ambient invocation is inexpensive and
  # non-shipment-scoped, and skipping it for docs/backlog-only changes would
  # leave exactly the commits most likely to touch `.backlogit/` state
  # unchecked.
  #
  # REQUIRED-VS-ADVISORY is an explicit OPERATOR TOGGLE via the
  # `PIPELINE_TOPOLOGY_GATE_REQUIRED` repository variable: unset (default)
  # means advisory -- `continue-on-error: true` keeps this job's reported
  # result `success` for dependents (including `ci-gate` below) even when the
  # gate itself reports BLOCK. Setting the variable to `'true'` flips
  # `continue-on-error` to `false`, making a BLOCK verdict fail this job (and
  # therefore `ci-gate`) for real -- with NO WORKFLOW RE-RENDER NEEDED. See
  # docs/pipeline-topology-gate.md and docs/pipeline-topology-gate-ci-rollout.md
  # for the staged advisory->required rollout.
  topology-check:
    name: pipeline-topology (ambient)
    runs-on: ubuntu-latest
    continue-on-error: ${{ vars.PIPELINE_TOPOLOGY_GATE_REQUIRED != 'true' }}
    steps:
      - name: Checkout
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          persist-credentials: false
      - name: Set up Python
        uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405 # v6.2.0
        with:
          python-version: '3.12'
      - name: Install autoharness
        run: python -m pip install -e .
      - name: Run CI topology-check entrypoint
        run: bash scripts/ci-topology-check.sh

  # Always-reporting aggregation gate. Runs no build — it only summarizes the
  # needed jobs. Passes unless a needed job failed or was cancelled (a skipped
  # test job is OK).
  ci-gate:
    name: ci gate
    if: always()
    needs: [changes, test, topology-check]
    runs-on: ubuntu-latest
    steps:
      - name: Verify no required job failed
        run: |
          results="${{ needs.changes.result }} ${{ needs.test.result }} ${{ needs['topology-check'].result }}"
          echo "job results: $results"
          for r in $results; do
            if [ "$r" = "failure" ] || [ "$r" = "cancelled" ]; then
              echo "::error::A required job did not succeed: $r"
              exit 1
            fi
          done
          echo "All required jobs passed or were intentionally skipped."
