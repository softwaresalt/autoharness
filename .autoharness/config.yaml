schema_version: "1.0.0"

# Resolved harness configuration for autoharness (self-install mode)
# Generated by: autoharness install-harness
# Generated at: 2026-04-26T21:16:00-07:00

preset: "full"
primary_stack_pack: "cli-tool"
stack_packs:
  - "cli-tool"
install_layers:
  - "foundation"
  - "instructions"
  - "workflow"
  - "review"
  - "runtime"
  - "backlog"
  - "knowledge"
  - "overlays"
capability_packs:
  - "agent-intercom"
  - "backlogit"
  - "agent-engram"
  - "graphtor-docs"

backlog:
  tool: "backlogit"
  directory: ".backlogit"
  suffix_map:
    feature: "F"
    chore: "C"
    task: "T"
    spike: "SP"
    deliberation: "DL"
    bug: "B"
    epic: "E"
    subtask: "ST"
    shipment: "S"

docs:
  root: "docs"
  subdirectories:
    compound: "compound"
    plans: "plans"
    decisions: "decisions"
    memory: "memory"
    closure: "closure"
    design_docs: "design-docs"
    product_specs: "product-specs"

continuous_learning:
  directory: ".autoharness/continuous-learning"
  capture_hooks: false
  environment_adapter: "none"
  promotion_threshold: 3

model_routing:
  tier1:
    model: "gpt-5.6-luna"
    model_family: "gpt-5.6-luna"
  tier2: "claude-sonnet-5"
  tier3: "claude-opus-5"
  orchestrator: "gpt-5.6-sol"
  # P-013.5: role routes — dogfood assignment (Stage -> claude-opus-5, Ship -> claude-sonnet-5)
  stage:
    model_family: "claude-opus-5"
    model_provider: "anthropic"
    reasoning_effort: "high"
  ship:
    model_family: "claude-sonnet-5"
    model_provider: "anthropic"
    reasoning_effort: "high"
  # P-013.6: explicit escalation route — distinct vendor/family from the
  # Stage role route (claude-opus-5/anthropic, already == tier3) so an
  # auto-escalation attempt is a genuine escalation, not a same-route no-op
  # (ESCALATION_DEGRADED guard, 011-DL(b)/106-F).
  escalation:
    model_family: "gpt-5.6-sol"
    model_provider: "openai"
    reasoning_effort: "high"

ai_tools:
  copilot_cli:
    exe_path: "copilot"

overrides: {}
