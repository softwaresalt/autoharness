schema_version: "1.1.0"

# Resolved harness configuration for autoharness (self-install mode)
# Generated by: autoharness install-harness
# Generated at: 2026-04-26T21:16:00-07:00

preset: "full"
primary_stack_pack: "cli-tool"
stack_packs:
  - "cli-tool"
install_layers:
  - "foundation"
  - "instructions"
  - "workflow"
  - "review"
  - "runtime"
  - "backlog"
  - "knowledge"
  - "overlays"
capability_packs:
  - "agent-intercom"
  - "backlogit"
  - "agent-engram"
  - "graphtor-docs"

backlog:
  tool: "backlogit"
  directory: ".backlogit"
  suffix_map:
    feature: "F"
    chore: "C"
    task: "T"
    spike: "SP"
    deliberation: "DL"
    bug: "B"
    epic: "E"
    subtask: "ST"
    shipment: "S"

docs:
  root: "docs"
  subdirectories:
    compound: "compound"
    plans: "plans"
    decisions: "decisions"
    memory: "memory"
    closure: "closure"
    design_docs: "design-docs"
    product_specs: "product-specs"

continuous_learning:
  directory: ".autoharness/continuous-learning"
  capture_hooks: false
  environment_adapter: "none"
  promotion_threshold: 3

model_routing:
  tier1:
    model: gpt-6-luna              # Fast/cheap: memory, docs, compaction (e.g., gpt-5.4-mini)
    reasoning_effort: "xhigh"  # Leave empty to use model default
    model_provider: "openai"       # e.g., openai, anthropic — leave empty for default
    model_family: "gpt-6-luna"           # Resolved into Tier 1 agent frontmatter
  tier2:
    model: claude-sonnet-5              # Standard: orchestration, code, review (e.g., claude-sonnet-5)
    reasoning_effort: "high"
    model_provider: "anthropic"
    model_family: "claude-sonnet-5"
  tier3:
    model: claude-opus-5.5              # Frontier: planning, architecture, analysis (e.g., claude-opus-5)
    reasoning_effort: "high"
    model_provider: "anthropic"
    model_family: "claude-opus-5.5"
  orchestrator:
    model_family: "claude-opus-5.5"             # Orchestrator model override
    model_provider: "anthropic"
    reasoning_effort: "high"
  # P-013.5: role routes — dogfood assignment (Stage -> claude-opus-5.5, Ship -> claude-opus-5.5)
  stage:
    model_family: "claude-opus-5.5"             # Stage role route (falls back to tier3 when empty)
    model_provider: "anthropic"
    reasoning_effort: "high"
  ship:
    model_family: "claude-opus-5.5"             # Ship role route (falls back to tier2 when empty)
    model_provider: "anthropic"
    reasoning_effort: "high"
  # P-013.6: explicit escalation route — distinct vendor/family from the
  # Stage role route (claude-opus-5/anthropic, already == tier3) so an
  # auto-escalation attempt is a genuine escalation, not a same-route no-op
  # (ESCALATION_DEGRADED guard, 011-DL(b)/106-F).
  escalation:
    model_family: "gpt-6-sol"
    model_provider: "openai"
    reasoning_effort: "xhigh"
  anchor_review:
    model_provider: "openai"       # Anchor reviewer provider (default: openai)
    model_family: "gpt-6-sol"           # Anchor reviewer family (default: gpt-5.6-sol)
    reasoning_effort: "high"  # Leave empty to use model default

ai_tools:
  copilot_cli:
    exe_path: "copilot"
    args: []


detectors:
  - node_id: "det:D-ART/ART-01@1"
    applies_when:
      changed_paths_any:
        - ".backlog/**"
        - ".backlogit/**"
    producer:
      kind: "pure"
      ref: "autoharness.detectors.art.section_markers:produce"
      tool_version_dims:
        - "python"
    validator:
      ref: "autoharness.detectors.art.section_markers:validate"
      consumes: []
    depends_on: []
    severity: "medium"
    mode: "report_only"
    remediation:
      class: "guided_fix"
      hint: "Restore the required backlogit section markers."
      target_refs:
        - "path:.backlogit/templates/task.md"
        - "path:.backlogit/templates/shipment.md"
      authority: "stage"

sidecars: ["backlogit", "engram", "graphtor-docs"]

overrides: {}
