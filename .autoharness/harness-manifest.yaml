variables_used:
  PROJECT_NAME: "autoharness"
  PRIMARY_LANGUAGE: "Python"
  PRIMARY_LANGUAGE_LOWER: "python"
  BUILD_COMMAND: "pip install -e ."
  TEST_COMMAND: "PYTHONPATH=src python -m unittest discover -s tests"
  UNIMPLEMENTED_MARKER: 'raise NotImplementedError("...")'
  LINT_COMMAND: 'markdownlint "**/*.md"'
  FORMAT_COMMAND: ""
  BUILD_CHECK_COMMAND: "python -m py_compile src/autoharness/cli.py"
  TEST_DIR: "tests"
  SOURCE_DIR: "src/autoharness"
  CI_PLATFORM: "GitHub Actions"
  REPO_OWNER: "softwaresalt"
  REPO_NAME: "autoharness"
  BACKLOG_TOOL_NAME: "backlogit"
  BACKLOG_DIRECTORY: ".backlogit"
  FEATURE_SHIPMENTS: "true"
  COPILOT_EXE_PATH: "copilot"
  DOCS_ROOT: "docs"
  DOCS_COMPOUND: "docs/compound"
  DOCS_PLANS: "docs/plans"
  DOCS_DECISIONS: "docs/decisions"
  DOCS_MEMORY: "docs/memory"
  DOCS_CLOSURE: "docs/closure"
  DOCS_DESIGN_DOCS: "docs/design-docs"
  DOCS_PRODUCT_SPECS: "docs/product-specs"
  CIRCUIT_BREAKER_COOLDOWN: "5 minutes"
  # --- Recorded by the 13-skill scoped merge-install (stash 8AC574F1). ---
  # Gate commands are this repository's real gates per .github/workflows/ci.yml:
  # "autoharness has no ruff/pyright/pytest configured; the only real gates are
  # the stdlib unittest suite (here) and markdownlint (the pre-commit/pre-push
  # hooks)."  profile.test.command ("pytest") and profile.lint.command ("") are
  # stale against that ground truth; recorded here so rendering matches reality
  # without mutating the discovery profile. Root-cause fix (re-running
  # workspace-discovery to correct profile.test/profile.lint) is deliberately
  # left as a follow-up, outside this shipment's scope.
  FORMAT_CHECK_COMMAND: "# no format check command configured"
  FORMAT_FIX_COMMAND: "# no format fix command configured"
  POLL_INTERVAL: "30"
  MAX_WAIT: "600"
  # profile.ci.quality_gates is empty; enumerated from the real CI job set.
  QUALITY_GATE_1: 'markdownlint "**/*.md"'
  QUALITY_GATE_2: "PYTHONPATH=src python -m unittest discover -s tests"
  QUALITY_GATE_3: "bash scripts/ci-topology-check.sh"
  QUALITY_GATE_4: "# no fourth quality gate configured"
  # Synthesized for primary language Python; restricted to paths that exist and
  # are git-tracked in this repository (src/autoharness/remote and
  # src/autoharness/supervise are untracked and deliberately excluded).
  SECURITY_REVIEW_PATTERNS: "`src/autoharness/cli.py`, `src/autoharness/gates/**`, `src/autoharness/verify_workspace.py`, `scripts/**`, `.github/workflows/**`"
  # .autoharness/backlog-registry.yaml omits the archive_item operation that
  # templates/backlog/registries/backlogit.registry.yaml declares; resolved from
  # the canonical registry template. Registry gap reported as a follow-up.
  OP_ARCHIVE_ITEM_MCP: "backlogit_archive_item"
  OP_ARCHIVE_ITEM_CLI: "backlogit archive {id}"
  # Registry cli_command values embed lowercase {{param}} runtime tokens;
  # normalized to the single-brace form the install-harness variable resolution
  # table documents (`backlogit show {id}`, `backlogit update {id}`).
  OP_CREATE_CLI: "backlogit add --type {artifact_type} --title {title}"
  OP_UPDATE_CLI: "backlogit update {id}"
  HARNESS_ENFORCED_SUMMARY: |
    * Markdown formatting and markdownlint heading hierarchy (MD001/MD025/MD041, P-008)
    * Workflow policies P-001 through P-021 and constitutional principle sequencing
    * Test-first red-green gate mechanics (P-002, P-004) and the `unittest` suite run
    * Merge-commit-only discipline (P-009, Principle XI) — squash and rebase are forbidden
    * Role-boundary enforcement (P-010) and single-worktree topology (P-016)
    * Backlog and shipment bookkeeping conventions (backlogit)
    * Template variable-completeness and cross-reference integrity checks
